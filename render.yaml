services:
  - type: web
    name: agent-help-network
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m ahn.cli migrate
    startCommand: uvicorn ahn.combined:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: AHN_DATABASE_URL
        fromDatabase:
          name: agent-help-network-db
          property: connectionString
      - key: AHN_KEY_PEPPER
        generateValue: true
      - key: AHN_TEST_MODE
        value: "0"
      - key: AHN_PUBLIC_MODE
        value: "1"
      - key: AHN_REPORTING_ENABLED
        value: "1"
      - key: AHN_MCP_PUBLIC_HOSTS
        value: agenthelpnetwork.com,www.agenthelpnetwork.com
      - key: AHN_COLLECT_LOOKUP_METRICS
        value: "1"
      - key: AHN_COLLECT_REQUEST_METRICS
        value: "1"
      - key: AHN_OWNER_PASSWORD
        generateValue: true
      - key: AHN_OWNER_ALLOWED_IPS
        sync: false
      # Exact verified developer name shown on the privacy, terms and support pages.
      - key: AHN_OPERATOR_NAME
        sync: false
      # Days to keep reports (30-3650); blank keeps them without an automatic deletion date.
      - key: AHN_REPORT_RETENTION_DAYS
        sync: false
      # 0 turns off the in-process background reader; the review cron still processes the queue.
      - key: AHN_BACKGROUND_READS
        value: "1"
      # Provenance stamped on stored reads and reports (ahn/provenance.py); these are the defaults.
      - key: AHN_OPERATOR_ID
        value: agenthelpnetwork.com
      - key: AHN_VANTAGE
        value: '{"kind":"datacenter","region":"US","asn":null,"declared":true}'
      # Offline data bundle (ahn/bundle.py): unset or anything but 1 keeps /v1/bundle/* at 404. Set 1 here and on the
      # review cron together, only after the owner approves publishing.
      - key: AHN_PUBLIC_BUNDLE
        sync: false
      # Required with AHN_PUBLIC_BUNDLE=1: the date (YYYY-MM-DD) the privacy policy shows as last updated.
      - key: AHN_PUBLIC_BUNDLE_SINCE
        sync: false

  - type: cron
    name: agent-help-network-review
    runtime: python
    plan: 0.5c-512mb
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ahn.auto_review
    envVars:
      - key: AHN_DATABASE_URL
        fromDatabase:
          name: agent-help-network-db
          property: connectionString
      # 1 rebuilds the offline bundle about once a day (see the web service); unset deletes the stored file.
      # Optional: AHN_EXPORT_SIGNING_KEY signs it.
      - key: AHN_PUBLIC_BUNDLE
        sync: false
      # The licensor named in the bundle's CC BY 4.0 notice; the build refuses to run without it.
      - key: AHN_OPERATOR_NAME
        sync: false
      # Provenance stamped on stored reads and reports (ahn/provenance.py); these are the defaults.
      - key: AHN_OPERATOR_ID
        value: agenthelpnetwork.com
      - key: AHN_VANTAGE
        value: '{"kind":"datacenter","region":"US","asn":null,"declared":true}'

  - type: cron
    name: agent-help-network-bandwidth-guard
    runtime: python
    plan: 0.5c-512mb
    # Render publishes bandwidth as one point per hour, about an hour late (docs/security-operations.md),
    # so a shorter period only trims the wait after a point appears; it does not make the data fresher.
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ahn.bandwidth_guard
    envVars:
      - key: AHN_DATABASE_URL
        fromDatabase:
          name: agent-help-network-db
          property: connectionString
      - key: AHN_GUARD_WEB_SERVICE_ID
        value: srv-db0hnkfavr4c73fp6et0
      # Must match the web service so the policy page and the scheduled cleanup agree.
      - key: AHN_REPORT_RETENTION_DAYS
        sync: false
      - key: RENDER_API_KEY
        sync: false

databases:
  - name: agent-help-network-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
