[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahn-client"
dynamic = ["version"]
description = "Ask Agent Help Network what a host declares and recommends when your browser automation is blocked. Read-only, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Agent Help Network" }]
keywords = ["agents", "browser-automation", "playwright", "browser-use", "langchain", "crewai", "openai-agents", "claude-agent-sdk", "robots-txt", "llms-txt", "web-access"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

# Framework adapters. The base install has no dependencies; each extra only pulls the framework the adapter plugs into.
[project.optional-dependencies]
langchain = ["langchain>=1.0"]
crewai = ["crewai>=1.15.9"]
openai-agents = ["openai-agents>=0.24"]
claude-agent-sdk = ["claude-agent-sdk>=0.1.27"]

[project.urls]
Homepage = "https://agenthelpnetwork.com"
Documentation = "https://agenthelpnetwork.com/en/agents"
Repository = "https://github.com/agent-help-network/agent-help-network"
Issues = "https://github.com/agent-help-network/agent-help-network/issues"

[tool.hatch.version]
path = "src/ahn_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ahn_client"]

[tool.hatch.build.targets.sdist]
include = ["src/ahn_client", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
