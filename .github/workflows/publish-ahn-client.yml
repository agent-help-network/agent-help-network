name: publish-ahn-client

# Publishes clients/python to PyPI as ahn-client through PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere. Runs only for a tag such as ahn-client-v0.1.0, and the tag
# must match __version__ in clients/python/src/ahn_client/__init__.py.
on:
  push:
    tags: ["ahn-client-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('clients/python/src/ahn_client/__init__.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "ahn-client-v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build clients/python --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
