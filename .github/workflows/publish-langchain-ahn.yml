name: publish-langchain-ahn

# Publishes clients/langchain-ahn to PyPI as langchain-ahn through PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere. Runs only for a tag such as langchain-ahn-v0.1.0, and the tag
# must match __version__ in clients/langchain-ahn/src/langchain_ahn/__init__.py.
# Creating the tag is a maintainer decision; this workflow does nothing until one is pushed.
on:
  push:
    tags: ["langchain-ahn-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('clients/langchain-ahn/src/langchain_ahn/__init__.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "langchain-ahn-v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build clients/langchain-ahn --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
