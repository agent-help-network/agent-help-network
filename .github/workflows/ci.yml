name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite refuses to reset any database not named exactly ahn_test.
      AHN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ahn_test
      AHN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ahn_test
      AHN_KEY_PEPPER: ci-pepper-must-be-at-least-thirty-two-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
